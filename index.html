<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boyle's Law Simulation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            margin-top: 0;
            color: #f1f5f9;
            font-size: 26px;
        }
        .description {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        /* Interactive display container */
        .display-box {
            background: #090d16;
            border-radius: 12px;
            width: 100%;
            height: 280px;
            position: relative;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px solid #334155;
        }

        /* Particle simulation canvas (Background) */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* GUARANTEED VISIBLE GOLDEN BALLOON (Foreground) */
        .balloon-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .balloon {
            background: radial-gradient(circle at 35% 35%, #fff1b8, #ffd700 45%, #d4af37 75%, #8b6508 100%);
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4), inset -10px -10px 20px rgba(0, 0, 0, 0.5);
            width: 130px;
            height: 130px;
            transition: width 0.08s ease-out, height 0.08s ease-out;
        }

        .balloon-knot {
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 11px solid #b8860b;
            margin-top: -2px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }
        label {
            font-weight: 600;
            font-size: 15px;
            color: #e2e8f0;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #ffd700;
        }
        
        .presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .preset-btn {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 4px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-btn:hover {
            background: #ffd700;
            color: #0f172a;
            border-color: #ffd700;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #0f172a;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid #334155;
            text-align: left;
        }
        .stats div span {
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Boyle's Law</h1>
    <div class="description">
